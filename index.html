<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Street Partners - Espaço Relax</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background: linear-gradient(145deg, #0b0e1a, #1a1f2f);
            color: #f0f3fa;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        header {
            width: 100%;
            padding: 15px;
            text-align: center;
            background: rgba(0, 0, 0, 0.2);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        header h1 {
            color: #f7c948;
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        header p {
            color: #a8b5d9;
            font-size: 0.8rem;
        }

        .menu {
            display: flex;
            gap: 10px;
            margin: 20px 0;
            flex-wrap: wrap;
            justify-content: center;
            padding: 0 10px;
        }

        .btn-jogo {
            padding: 10px 18px;
            border-radius: 30px;
            border: 2px solid rgba(247, 201, 72, 0.3);
            background: transparent;
            color: #f7c948;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-jogo:hover, .btn-jogo.ativo {
            background: #f7c948;
            color: #0b0e1a;
            border-color: #f7c948;
            box-shadow: 0 0 15px rgba(247, 201, 72, 0.4);
        }

        .area-jogo {
            width: 95%;
            max-width: 800px;
            height: 500px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
            overflow: hidden;
            display: none;
        }

        .area-jogo.ativo {
            display: block;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
        }

        .respira-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            background: #0b0e1a;
            z-index: 10;
        }

        .circulo-respira {
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, #4fc3f7, #1a5f8a);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 40px rgba(79, 195, 247, 0.3);
            transition: transform 4s ease-in-out;
        }

        .texto-respira {
            margin-top: 40px;
            font-size: 1.5rem;
            color: #f0f3fa;
            font-weight: 300;
            letter-spacing: 2px;
        }

        /* Estilos para Sons da Natureza */
        .sons-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            align-items: center;
            height: 100%;
            padding: 20px;
        }

        .btn-som {
            width: 120px;
            height: 120px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 2.5rem;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: 0.3s;
        }

        .btn-som span {
            font-size: 0.8rem;
            margin-top: 10px;
            color: #a8b5d9;
        }

        .btn-som.ativo {
            background: rgba(79, 195, 247, 0.2);
            border-color: #4fc3f7;
            box-shadow: 0 0 20px rgba(79, 195, 247, 0.4);
        }

        footer {
            margin-top: auto;
            padding: 15px;
            font-size: 0.8rem;
            color: #6b7699;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <h1>🧩 Street Partners</h1>
        <p>Regule seus sentidos e respire</p>
    </header>

    <div class="menu">
        <button class="btn-jogo ativo" onclick="mudarJogo('bolhas', this)">🫧 Bolhas</button>
        <button class="btn-jogo" onclick="mudarJogo('respiracao', this)">🧘 Respiração</button>
        <button class="btn-jogo" onclick="mudarJogo('pintura', this)">🎨 Pintura</button>
        <button class="btn-jogo" onclick="mudarJogo('jardim', this)">🌻 Jardim Zen</button>
        <button class="btn-jogo" onclick="mudarJogo('estrelas', this)">✨ Estrelas</button>
        <button class="btn-jogo" onclick="mudarJogo('sons', this)">🎵 Sons</button>
    </div>

    <div class="area-jogo ativo" id="jogo-bolhas"><canvas id="canvasBolhas"></canvas></div>
    
    <div class="area-jogo" id="jogo-respiracao">
        <div class="respira-container">
            <div class="circulo-respira" id="circulo"></div>
            <div class="texto-respira" id="textoRespira">Inspire...</div>
        </div>
    </div>

    <div class="area-jogo" id="jogo-pintura"><canvas id="canvasPintura"></canvas></div>
    
    <div class="area-jogo" id="jogo-jardim"><canvas id="canvasJardim"></canvas></div>
    
    <div class="area-jogo" id="jogo-estrelas"><canvas id="canvasEstrelas"></canvas></div>

    <div class="area-jogo" id="jogo-sons">
        <div class="sons-container">
            <button class="btn-som" onclick="toggleSom('chuva', this)">🌧️<span>Chuva</span></button>
            <button class="btn-som" onclick="toggleSom('mar', this)">🌊<span>Mar</span></button>
            <button class="btn-som" onclick="toggleSom('floresta', this)">🌲<span>Floresta</span></button>
            <button class="btn-som" onclick="toggleSom('ruido', this)">📻<span>Ruído Branco</span></button>
        </div>
    </div>

    <footer>A luta é em equipe. Você está seguro. 💙</footer>

    <script>
        let jogoAtual = 'bolhas';

        function mudarJogo(jogo, btn) {
            jogoAtual = jogo;
            document.querySelectorAll('.btn-jogo').forEach(b => b.classList.remove('ativo'));
            btn.classList.add('ativo');

            document.querySelectorAll('.area-jogo').forEach(area => area.classList.remove('ativo'));
            document.getElementById('jogo-' + jogo).classList.add('ativo');

            if (jogo === 'bolhas') iniciarBolhas();
            if (jogo === 'respiracao') iniciarRespiracao();
            if (jogo === 'pintura') iniciarPintura();
            if (jogo === 'jardim') iniciarJardim();
            if (jogo === 'estrelas') iniciarEstrelas();
            if (jogo === 'sons') pararTodosSons(); // Para os sons se mudar de tela
        }

        // ==========================================
        // 1. BOLHAS SENSORIAIS
        // ==========================================
        const canvasBolhas = document.getElementById('canvasBolhas');
        const ctxBolhas = canvasBolhas.getContext('2d');
        let bolhas = [];
        let animBolhas;

        function iniciarBolhas() {
            canvasBolhas.width = canvasBolhas.parentElement.clientWidth;
            canvasBolhas.height = canvasBolhas.parentElement.clientHeight;
            bolhas = [];
            cancelAnimationFrame(animBolhas);
            loopBolhas();
        }

        function criarBolha() {
            bolhas.push({
                x: Math.random() * canvasBolhas.width,
                y: canvasBolhas.height + 50,
                raio: Math.random() * 30 + 10,
                velocidade: Math.random() * 1.5 + 0.5,
                cor: `hsla(${Math.random() * 360}, 60%, 60%, 0.4)`
            });
        }

        function loopBolhas() {
            if (jogoAtual !== 'bolhas') return;
            ctxBolhas.clearRect(0, 0, canvasBolhas.width, canvasBolhas.height);
            if (Math.random() < 0.04) criarBolha();

            for (let i = bolhas.length - 1; i >= 0; i--) {
                let b = bolhas[i];
                b.y -= b.velocidade;
                ctxBolhas.beginPath();
                ctxBolhas.arc(b.x, b.y, b.raio, 0, Math.PI * 2);
                ctxBolhas.fillStyle = b.cor;
                ctxBolhas.fill();
                if (b.y < -50) bolhas.splice(i, 1);
            }
            animBolhas = requestAnimationFrame(loopBolhas);
        }

        function tocarBolha(e) {
            if (jogoAtual !== 'bolhas') return;
            let rect = canvasBolhas.getBoundingClientRect();
            let x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
            let y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
            for (let i = bolhas.length - 1; i >= 0; i--) {
                let b = bolhas[i];
                if (Math.sqrt((x - b.x)**2 + (y - b.y)**2) < b.raio) {
                    bolhas.splice(i, 1);
                    break;
                }
            }
        }
        canvasBolhas.addEventListener('mousedown', tocarBolha);
        canvasBolhas.addEventListener('touchstart', tocarBolha);

        // ==========================================
        // 2. RESPIRAÇÃO GUIADA
        // ==========================================
        const circulo = document.getElementById('circulo');
        const textoRespira = document.getElementById('textoRespira');
        let intervalRespira;

        function iniciarRespiracao() {
            clearInterval(intervalRespira);
            let fase = 0;
            function ciclo() {
                if (fase === 0) { textoRespira.innerText = "Inspire..."; circulo.style.transform = "scale(2)"; fase = 1; }
                else if (fase === 1) { textoRespira.innerText = "Segure..."; fase = 2; }
                else if (fase === 2) { textoRespira.innerText = "Expire..."; circulo.style.transform = "scale(1)"; fase = 3; }
                else { textoRespira.innerText = "Pausa..."; fase = 0; }
            }
            ciclo();
            intervalRespira = setInterval(ciclo, 4000);
        }

        // ==========================================
        // 3. PINTURA LIVRE
        // ==========================================
        const canvasPintura = document.getElementById('canvasPintura');
        const ctxPintura = canvasPintura.getContext('2d');
        let desenhando = false;

        function iniciarPintura() {
            canvasPintura.width = canvasPintura.parentElement.clientWidth;
            canvasPintura.height = canvasPintura.parentElement.clientHeight;
            ctxPintura.lineCap = 'round';
            ctxPintura.lineJoin = 'round';
            ctxPintura.lineWidth = 6;
        }

        function drawPintura(e) {
            if (!desenhando || jogoAtual !== 'pintura') return;
            e.preventDefault();
            let rect = canvasPintura.getBoundingClientRect();
            let x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
            let y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
            
            ctxPintura.strokeStyle = `hsl(${(x + y) % 360}, 70%, 60%)`; // Cor muda com a posição
            ctxPintura.lineTo(x, y);
            ctxPintura.stroke();
            ctxPintura.beginPath();
            ctxPintura.moveTo(x, y);
        }

        canvasPintura.addEventListener('mousedown', (e) => { desenhando = true; drawPintura(e); });
        canvasPintura.addEventListener('mousemove', drawPintura);
        canvasPintura.addEventListener('mouseup', () => { desenhando = false; ctxPintura.beginPath(); });
        canvasPintura.addEventListener('mouseout', () => { desenhando = false; ctxPintura.beginPath(); });
        canvasPintura.addEventListener('touchstart', (e) => { desenhando = true; drawPintura(e); });
        canvasPintura.addEventListener('touchmove', drawPintura);
        canvasPintura.addEventListener('touchend', () => { desenhando = false; ctxPintura.beginPath(); });

        // ==========================================
        // 4. JARDIM ZEN
        // ==========================================
        const canvasJardim = document.getElementById('canvasJardim');
        const ctxJardim = canvasJardim.getContext('2d');
        let flores = [];
        let animJardim;

        function iniciarJardim() {
            canvasJardim.width = canvasJardim.parentElement.clientWidth;
            canvasJardim.height = canvasJardim.parentElement.clientHeight;
            cancelAnimationFrame(animJardim);
            loopJardim();
        }

        function plantarFlor(e) {
            if (jogoAtual !== 'jardim') return;
            let rect = canvasJardim.getBoundingClientRect();
            let x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
            let y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
            
            flores.push({
                x: x, y: y, tamanho: 0, maxTamanho: Math.random() * 20 + 15,
                cor: `hsl(${Math.random() * 360}, 70%, 60%)`
            });
        }
        canvasJardim.addEventListener('mousedown', plantarFlor);
        canvasJardim.addEventListener('touchstart', plantarFlor);

        function loopJardim() {
            if (jogoAtual !== 'jardim') return;
            // Fundo tipo grama escura
            ctxJardim.fillStyle = '#0f1a12'; 
            ctxJardim.fillRect(0, 0, canvasJardim.width, canvasJardim.height);

            for (let i = 0; i < flores.length; i++) {
                let f = flores[i];
                if (f.tamanho < f.maxTamanho) f.tamanho += 0.2; // Cresce suavemente

                // Desenha caule
                ctxJardim.beginPath();
                ctxJardim.moveTo(f.x, f.y);
                ctxJardim.lineTo(f.x, f.y - f.tamanho);
                ctxJardim.strokeStyle = '#4caf50';
                ctxJardim.stroke();

                // Desenha pétalas
                ctxJardim.beginPath();
                ctxJardim.arc(f.x, f.y - f.tamanho, f.tamanho/2, 0, Math.PI * 2);
                ctxJardim.fillStyle = f.cor;
                ctxJardim.fill();
            }
            animJardim = requestAnimationFrame(loopJardim);
        }

        // ==========================================
        // 5. ESTRELAS CADENTES
        // ==========================================
        const canvasEstrelas = document.getElementById('canvasEstrelas');
        const ctxEstrelas = canvasEstrelas.getContext('2d');
        let estrelas = [];
        let animEstrelas;

        function iniciarEstrelas() {
            canvasEstrelas.width = canvasEstrelas.parentElement.clientWidth;
            canvasEstrelas.height = canvasEstrelas.parentElement.clientHeight;
            estrelas = [];
            cancelAnimationFrame(animEstrelas);
            loopEstrelas();
        }

        function desenharEstrela(e) {
            if (jogoAtual !== 'estrelas') return;
            let rect = canvasEstrelas.getBoundingClientRect();
            let x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
            let y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
            
            estrelas.push({ x: x, y: y, brilho: 1, vida: 1 });
        }
        canvasEstrelas.addEventListener('mousedown', desenharEstrela);
        canvasEstrelas.addEventListener('mousemove', (e) => { if(e.buttons === 1) desenharEstrela(e); }); // Desenha arrastando
        canvasEstrelas.addEventListener('touchmove', desenharEstrela);

        function loopEstrelas() {
            if (jogoAtual !== 'estrelas') return;
            ctxEstrelas.fillStyle = '#050510'; // Céu noturno
            ctxEstrelas.fillRect(0, 0, canvasEstrelas.width, canvasEstrelas.height);

            for (let i = estrelas.length - 1; i >= 0; i--) {
                let st = estrelas[i];
                st.vida -= 0.005;
                if (st.vida <= 0) { estrelas.splice(i, 1); continue; }

                ctxEstrelas.beginPath();
                ctxEstrelas.arc(st.x, st.y, 2, 0, Math.PI * 2);
                ctxEstrelas.fillStyle = `rgba(255, 255, 200, ${st.vida})`;
                ctxEstrelas.shadowBlur = 10;
                ctxEstrelas.shadowColor = 'white';
                ctxEstrelas.fill();
                ctxEstrelas.shadowBlur = 0;
            }
            animEstrelas = requestAnimationFrame(loopEstrelas);
        }

        // ==========================================
        // 6. SONS DA NATUREZA (Web Audio API)
        // ==========================================
        let audioCtx = null;
        let fontesAtivas = {};

        function tocarSom(tipo) {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const bufferSize = audioCtx.sampleRate * 2;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            
            // Gera Ruído
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }

            let noiseSource = audioCtx.createBufferSource();
            noiseSource.buffer = buffer;
            noiseSource.loop = true;

            let filter = audioCtx.createBiquadFilter();
            let gain = audioCtx.createGain();
            gain.gain.value = 0.3;

            if (tipo === 'chuva') {
                filter.type = 'lowpass';
                filter.frequency.value = 1000;
            } else if (tipo === 'mar') {
                filter.type = 'lowpass';
                filter.frequency.value = 400; // Som mais grave
            } else if (tipo === 'floresta') {
                filter.type = 'bandpass';
                filter.frequency.value = 2000;
            } else {
                filter.type = 'allpass'; // Ruído branco puro
            }

            noiseSource.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);
            noiseSource.start();

            return { source: noiseSource, gain: gain };
        }

        function toggleSom(tipo, btn) {
            if (fontesAtivas[tipo]) {
                // Desliga
                fontesAtivas[tipo].gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                setTimeout(() => { fontesAtivas[tipo].source.stop(); }, 500);
                delete fontesAtivas[tipo];
                btn.classList.remove('ativo');
            } else {
                // Liga
                fontesAtivas[tipo] = tocarSom(tipo);
                btn.classList.add('ativo');
            }
        }

        function pararTodosSons() {
            for (let tipo in fontesAtivas) {
                if (fontesAtivas[tipo]) {
                    fontesAtivas[tipo].source.stop();
                }
            }
            fontesAtivas = {};
            document.querySelectorAll('.btn-som').forEach(b => b.classList.remove('ativo'));
        }

        // Inicializador
        window.onload = () => iniciarBolhas();
        window.onresize = () => {
            if (jogoAtual === 'bolhas') iniciarBolhas();
            if (jogoAtual === 'pintura') iniciarPintura();
            if (jogoAtual === 'jardim') iniciarJardim();
            if (jogoAtual === 'estrelas') iniciarEstrelas();
        };
    </script>
</body>
</html>
