<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eduarda Cardoso - Nails Designer</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Great+Vibes&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background-color: #ffffff;
    background-image: 
      radial-gradient(circle at 20% 20%, rgba(212, 175, 55, 0.05) 0%, transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(212, 175, 55, 0.05) 0%, transparent 50%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    font-family: 'Montserrat', sans-serif;
    overflow-x: hidden;
  }

  .container {
    max-width: 720px;
    width: 100%;
    text-align: center;
    position: relative;
  }

  .container::before,
  .container::after {
    content: '';
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    width: 80px;
    height: 1px;
    background: linear-gradient(90deg, transparent, #d4af37, transparent);
  }

  .container::before { top: 0; }
  .container::after { bottom: 0; }

  .frame {
    border: 1px solid #d4af37;
    padding: 60px 40px;
    position: relative;
    background: #ffffff;
    box-shadow: 0 20px 60px rgba(212, 175, 55, 0.08);
  }

  .frame::before,
  .frame::after {
    content: '✦';
    position: absolute;
    color: #d4af37;
    font-size: 18px;
    background: #ffffff;
    padding: 0 8px;
  }

  .frame::before {
    top: -12px;
    left: 50%;
    transform: translateX(-50%);
  }

  .frame::after {
    bottom: -12px;
    left: 50%;
    transform: translateX(-50%);
  }

  .divider-top {
    color: #d4af37;
    font-size: 12px;
    letter-spacing: 8px;
    margin-bottom: 20px;
    opacity: 0.8;
  }

  h1 {
    font-family: 'Great Vibes', cursive;
    font-size: clamp(2.8rem, 7vw, 4.5rem);
    font-weight: 400;
    background: linear-gradient(135deg, #b8860b 0%, #d4af37 25%, #f4e5a1 50%, #d4af37 75%, #b8860b 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    line-height: 1.1;
    margin-bottom: 8px;
    letter-spacing: 2px;
  }

  .subtitle {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(1rem, 2.5vw, 1.4rem);
    letter-spacing: 6px;
    text-transform: uppercase;
    background: linear-gradient(135deg, #b8860b, #d4af37, #b8860b);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 600;
    margin-bottom: 30px;
  }

  .ornament {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
    margin: 30px 0;
  }

  .ornament::before,
  .ornament::after {
    content: '';
    height: 1px;
    width: 80px;
    background: linear-gradient(90deg, transparent, #d4af37);
  }

  .ornament::after {
    background: linear-gradient(90deg, #d4af37, transparent);
  }

  .ornament span {
    color: #d4af37;
    font-size: 20px;
  }

  .info-section {
    margin: 25px 0;
  }

  .info-label {
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.85rem;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #d4af37;
    margin-bottom: 8px;
    font-weight: 600;
  }

  .info-text {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.25rem;
    color: #b8860b;
    letter-spacing: 1px;
    font-weight: 500;
    line-height: 1.6;
  }

  .location-block {
    margin: 35px 0;
  }

  .phone-section {
    margin: 35px 0;
  }

  .phone-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 15px;
    align-items: center;
  }

  .phone-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 24px;
    border: 1px solid rgba(212, 175, 55, 0.3);
    border-radius: 30px;
    transition: all 0.3s ease;
    text-decoration: none;
    background: linear-gradient(135deg, rgba(212, 175, 55, 0.03), rgba(212, 175, 55, 0.08));
  }

  .phone-item:hover {
    border-color: #d4af37;
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(212, 175, 55, 0.15);
    background: linear-gradient(135deg, rgba(212, 175, 55, 0.08), rgba(212, 175, 55, 0.15));
  }

  .phone-icon {
    color: #d4af37;
    font-size: 14px;
  }

  .phone-number {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.15rem;
    font-weight: 600;
    letter-spacing: 2px;
    background: linear-gradient(135deg, #b8860b, #d4af37, #b8860b);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .services {
    margin-top: 40px;
    padding-top: 30px;
    border-top: 1px solid rgba(212, 175, 55, 0.25);
  }

  .services-text {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(1.05rem, 2.2vw, 1.3rem);
    font-style: italic;
    color: #b8860b;
    letter-spacing: 1.5px;
    line-height: 1.8;
    font-weight: 500;
  }

  .services-text strong {
    color: #d4af37;
    font-weight: 700;
    font-style: normal;
  }

  @media (max-width: 500px) {
    .frame {
      padding: 45px 22px;
    }
    .ornament::before,
    .ornament::after {
      width: 40px;
    }
  }
</style>
</head>
<body>

  <div class="container">
    <div class="frame">
      <div class="divider-top">✦ ✦ ✦</div>

      <h1>Eduarda Cardoso</h1>
      <div class="subtitle">Nails Designer</div>

      <div class="ornament"><span>✦</span></div>

      <div class="location-block">
        <div class="info-label">Localização</div>
        <div class="info-text">
          Getulina — SP<br>
          Júlio Prestes, 235
        </div>
      </div>

      <div class="ornament"><span>❦</span></div>

      <div class="phone-section">
        <div class="info-label">Contato</div>
        <div class="phone-list">
          <a href="tel:+5514996204750" class="phone-item">
            <span class="phone-icon">✆</span>
            <span class="phone-number">(14) 99620-4750</span>
          </a>
          <a href="tel:+5514996548850" class="phone-item">
            <span class="phone-icon">✆</span>
            <span class="phone-number">(14) 99654-8850</span>
          </a>
          <a href="tel:+5514991147242" class="phone-item">
            <span class="phone-icon">✆</span>
            <span class="phone-number">(14) 99114-7242</span>
          </a>
        </div>
      </div>

      <div class="ornament"><span>✦</span></div>

      <div class="services">
        <div class="info-label">Especialidades</div>
        <div class="services-text">
          Especialista em <strong>unhas</strong>, <strong>cílios</strong>,<br>
          <strong>pedicure</strong> e <strong>manicure</strong>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
